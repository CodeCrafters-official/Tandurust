services:
  - type: web
    name: tandurust-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        value: sqlite:///tandurust.db
      - key: SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        value: ""
      - key: PYTHON_VERSION
        value: 3.11.0
